<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hours</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#151517" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hours" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="loading" id="loading">Connecting…</div>

    <div class="app" id="app" hidden>
      <header class="top">
        <div class="title-row">
          <span class="title">Hours</span>
          <span class="today" id="today-label"></span>
        </div>
        <div class="chips" id="chip-rail"></div>
      </header>

      <div class="scroll-body" id="scroll-body"></div>

      <div class="bottom-slot" id="bottom-slot"></div>
      <div class="bottom-spacer"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
